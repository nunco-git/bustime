<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>버스 와유~~ (간단 화면)</title>
<!-- 저사양/구형 폰용 간단 화면: 지도·노선 없이 도착정보와 음성 안내 설정만. 오래된 웹뷰에서도 돌도록 ES5 문법만 사용합니다. -->
<style>
  html { font-size: 24px; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: sans-serif; background: #f3f4f6; color: #111827; line-height: 1.4; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 10px; }
  .top { display: -webkit-box; display: flex; justify-content: space-between; align-items: center; margin: 4px 0 10px; }
  h1 { font-size: 1.1rem; margin: 0; }
  .card { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid #e5e7eb; }
  button, select, input { font-size: 1rem; padding: .5rem .6rem; border: 2px solid #d1d5db; border-radius: 10px; font-family: inherit; }
  button { background: #1d4ed8; color: #fff; border: 0; margin: 3px 3px 3px 0; }
  button.g { background: #e0e7ff; color: #1d4ed8; }
  button.on { background: #16a34a; color: #fff; }
  button.sel { outline: 3px solid #f59e0b; }
  select, input { width: 100%; background: #fff; color: #111827; margin-top: 4px; }
  label { display: block; font-weight: bold; margin: .7rem 0 .2rem; }
  .sub { color: #4b5563; font-size: .7rem; }
  .err { color: #b91c1c; }
  .big { font-size: 1.3rem; font-weight: bold; }
  .bus { -webkit-flex-wrap: wrap; flex-wrap: wrap; display: -webkit-box; display: flex; justify-content: space-between; align-items: center; padding: .5rem 0; border-bottom: 1px solid #e5e7eb; }
  .bus.watch { background: #fef9c3; padding-left: 6px; padding-right: 6px; }
  .no { font-size: 1.4rem; font-weight: bold; }
  .min { font-size: 1.4rem; font-weight: bold; color: #1d4ed8; text-align: right; }
  .row { margin-top: 4px; }
  .fav { display: -webkit-box; display: flex; justify-content: space-between; align-items: center; padding: .4rem 0; border-bottom: 1px solid #e5e7eb; }
  a { color: #1d4ed8; }
  .bus button { width: 100%; margin-top: 4px; padding: .4rem; }
  #busChips button { margin: 3px 6px 3px 0; padding: .4rem .9rem; border-radius: 999px; font-weight: bold; background: #e0e7ff; color: #1d4ed8; }
  #busChips button.on, #scChips button.on { background: #16a34a; color: #fff; }
  #scChips button { margin: 3px 6px 3px 0; padding: .4rem .9rem; border-radius: 999px; font-weight: bold; background: #e0e7ff; color: #1d4ed8; }
  #scDays button { margin: 2px 4px 2px 0; padding: .4rem .7rem; }
  summary { padding: .35rem 0; font-weight: bold; }
  .dir { color: #1d4ed8; font-size: .75rem; font-weight: bold; }
</style>
</head>
<body>
<div class="wrap">

  <div id="main">
    <div class="top">
      <h1>🚌 버스 와유~~</h1>
      <button class="g" id="gear">⚙ 설정</button>
    </div>

    <div class="card" id="favBox" hidden>
      <details open>
        <summary><b>즐겨찾기 정류장</b></summary>

      </details>
    </div>
  </div>

  <div id="scModal" hidden style="position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:50;padding:12px;overflow:auto">
  <div class="card">
    <b id="scTitle">⏰ 예약 안내</b>
    <label>요일 (눌러서 선택)</label>
    <div id="scDays"></div>
    <button class="g" data-scpre="wk">평일</button> <button class="g" data-scpre="we">주말</button> <button class="g" data-scpre="all">매일</button>
    <label>시작 ~ 끝 시각</label>
    <select id="scFH"></select><select id="scFM"></select>
    <select id="scTH"></select><select id="scTM"></select>
    <label for="scStop">안내받을 정류장 (즐겨찾기에서)</label>
    <select id="scStop"></select>
    <label>안내받을 버스 (눌러서 선택)</label>
    <div id="scChips"></div>
    <input id="scBuses" placeholder="목록에 없으면 직접 입력 (예: 150, 207)">
    <label for="scMin">도착 몇 분 전에 안내할까요?</label>
    <select id="scMin"></select>
    <label>안내 방법 (눌러서 켜고 끄기)</label>
    <button id="scVoice">🔊 음성: 켜짐</button>
    <button id="scVib">📳 진동: 켜짐</button>
    <label>반복 안내</label>
    <select id="scRep"></select>
    <select id="scGap"></select>
    <div class="err" id="scErr"></div>
    <button id="scOk">저장</button>
    <button class="g" id="scDel" hidden>삭제</button>
    <button class="g" id="scCancel">취소</button>
  </div>
</div>

<div id="amModal" hidden style="position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:50;padding:12px">
  <div class="card" style="margin-top:20%">
    <b id="amTitle">🔔 알람 설정</b>

<div id="set" hidden>
    <div class="top">
      <h1>⚙ 설정</h1>
      <button class="g" id="back">← 돌아가기</button>
    </div>
    <div class="card">
      <b>글자 크기</b>
      <div class="row" id="fontBtns">
        <button class="g" data-scale="1">작게</button>
        <button class="g" data-scale="1.25">보통</button>

      <label>🔔 음성 안내</label>

      <select id="alertMin"><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option></select>

    <div class="card">

        <button class="g" id="exactBtn">⏰ 정확한 시각 알람 허용</button>

    <div class="card">
      <b>🔍 정류장 찾기</b>

      <button id="search">검색</button>

        <button id="hearToggle">음성 안내 듣기: 켜짐</button>

      </div>
      <div class="sub" id="msg"></div>
    </div>

    <div class="sub" style="text-align:center">
      <a href="/">전체 화면(지도 포함)으로 보기</a> · lite v19 · 앱 연결: <span id="nat"></span>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
(function () {
var API = "/api", REFRESH_SEC = 30, MAX_WATCH_MIN = 60;
var NATIVE = typeof window.AndroidBridge !== "undefined";

function $(id) { return document.getElementById(id); }
function ls(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function toArr(v) { return v == null || v === "" ? [] : (Object.prototype.toString.call(v) === "[object Array]" ? v : [v]); }
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function clampMin(n) { return Math.min(20, Math.max(5, Number(n) || 5)); }
function norm(s) { return String(s).replace(/\s+/g, ""); }
function setMsg(t, err) { var m = $("msg"); m.textContent = t || ""; m.className = "sub" + (err ? " err" : ""); }

/* ---------- 공공데이터 호출 (XMLHttpRequest) ---------- */
function call(op, params, cb) {
  var q = "op=" + op + "&t=" + new Date().getTime(), k;
  for (k in params) if (params.hasOwnProperty(k)) q += "&" + k + "=" + encodeURIComponent(params[k]);
  var x = new XMLHttpRequest(), done = false;
  function fin(err, items) { if (done) return; done = true; cb(err, items); }
  x.open("GET", API + "?" + q, true);
  x.timeout = 15000;
  x.onreadystatechange = function () {
    if (x.readyState !== 4 || x.status === 0) return;
    var j;
    try { j = JSON.parse(x.responseText); }
    catch (e) { return fin(new Error("공공데이터 응답 오류: " + String(x.responseText || x.status).replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").slice(0, 100))); }
    if (!j.response) return fin(new Error(j.error ? "서버 오류: " + j.error : "응답 형식이 올바르지 않습니다."));
    var h = j.response.header;
    if (h && h.resultCode !== "00") return fin(new Error(h.resultMsg || "API 오류"));
    var b = j.response.body;
    fin(null, toArr(b && b.items && b.items.item));
  };
  x.ontimeout = function () { fin(new Error("시간이 오래 걸립니다. 잠시 뒤에 다시 해 주세요.")); };
  x.onerror = function () { fin(new Error("인터넷 연결을 확인해 주세요.")); };
  x.send();
}

/* ---------- 'OO 방면' 표시 ---------- */
var dirCache = {}, dirQueue = [], dirBusy = false;
// 다음 정류장과 종점을 같이: "다음 ○○ · 종점 △△" (바로 다음이 종점이면 "다음이 종점 △△")
function dirPart(next, last) {
  if (last === "종점") return "종점";
  return next ? (next === last ? "다음이 종점 " + last : "다음 " + next + " · 종점 " + last) : "종점 " + last;
}
function dirParts(dests, nexts) {
  var o = [], i;
  for (i = 0; i < dests.length && i < 2; i++) o.push(dirPart(nexts && nexts[i], dests[i]));
  return o.join(" / ");
}
function dirText(names, nexts) {
  if (!names || !names.length) return "";
  return names[0] === "종점" ? "종점" : dirParts(names, nexts) + " 방면";
}
function dirNext() {
  var j = dirQueue.shift();
  if (!j) { dirBusy = false; return; }
  if (dirCache.hasOwnProperty(j.k)) { j.cb(dirCache[j.k]); return dirNext(); }
  call("direction", { cityCode: j.c, nodeId: j.n }, function (err, it) {
    dirCache[j.k] = err ? "" : dirText(it && it[0] && it[0].names, it && it[0] && it[0].nexts);
    j.cb(dirCache[j.k]);
    dirNext();
  });
}
function dirFor(c, n, cb) {
  var k = c + ":" + n;
  if (dirCache.hasOwnProperty(k)) { cb(dirCache[k]); return; }
  dirQueue.push({ k: k, c: c, n: n, cb: cb });
  if (!dirBusy) { dirBusy = true; dirNext(); }
}
function fillDirs(root) {
  var els = root.querySelectorAll(".dir[data-dir]"), i;
  for (i = 0; i < els.length; i++) (function (el) {
    if (el.getAttribute("data-done")) return;
    el.setAttribute("data-done", "1");
    var p = el.getAttribute("data-dir").split(":");
    dirFor(p[0], p[1], function (t) { el.textContent = t ? "→ " + t : ""; });
  })(els[i]);
}

/* ---------- 설정(CFG): 기기 저장 또는 계정 ---------- */
function localCfg() {
  return { on: ls("busAlertOn", false), buses: ls("busAlertBuses", ""), min: clampMin(ls("busAlertMin", 5)),
    hear: ls("busAlertHear", true), vib: ls("busAlertVib", true), rep: Number(ls("busAlertRep", 1)),
    gap: Number(ls("busAlertGap", 60)), stop: ls("busAlertStop", null), bset: ls("busAlertBset", {}), sched: ls("busAlertSched", []) };
}
var acctOn = ls("acctOn", false), CFG = localCfg();
if (acctOn) { var cc = ls("acctCfg", null); if (cc) CFG = cc; }
var fbUser = null, db = null, auth = null, unsub = null, lastSig = "";
var current = null, timer = null, watchStart = 0;

function listen() { return CFG.hear !== false && !ls("muteHere", false); }
function stopKey(s) { return s ? String(s.cityCode) + ":" + String(s.nodeid) : ""; }
function sameStop(a, b) { return !!(a && b && String(a.nodeid) === String(b.nodeid) && String(a.cityCode) === String(b.cityCode)); }
function sig() { return JSON.stringify([CFG.on, CFG.buses, CFG.min, CFG.hear, CFG.vib, CFG.rep, CFG.gap, CFG.stop && stopKey(CFG.stop), CFG.bset, CFG.sched]); }
function favs() { return ls("busFavs", []); }
function stopOut(s) {
  var o = { cityCode: String(s.cityCode), cityName: String(s.cityName || ""), nodeid: String(s.nodeid),
    nodenm: String(s.nodenm), nodeno: String(s.nodeno == null ? "" : s.nodeno) };
  if (s.twins && Object.prototype.toString.call(s.twins) === "[object Array]") {
    o.twins = [];
    for (var i = 0; i < s.twins.length && i < 3; i++) o.twins.push(twinOut(s.twins[i]));
  }
  return o;
}
function twinOut(t) {
  return { cityCode: String(t.cityCode), cityName: String(t.cityName || ""), nodeid: String(t.nodeid), nodeno: String(t.nodeno == null ? "" : t.nodeno) };
}
function twinList(st) {      // 시·군마다 한 곳만 (이미 저장된 예전 묶음에 같은 시·군이 둘 있어도 하나로)
  var out = [], seen = {}, i, t;
  if (!st || !st.twins || Object.prototype.toString.call(st.twins) !== "[object Array]") return out;
  for (i = 0; i < st.twins.length; i++) { t = st.twins[i]; if (!seen[t.cityCode]) { seen[t.cityCode] = true; out.push(t); } }
  return out;
}
function saveFavs(f) {
  lsSet("busFavs", f);
  var out = f.map(stopOut), keep = true, i;
  // 즐겨찾기에서 뺀 정류장이 안내 정류장이면 안내 정류장도 비움 (계정에는 한 번에 같이 씀)
  if (CFG.stop) {
    keep = false;
    for (i = 0; i < f.length; i++) if (String(f[i].nodeid) === String(CFG.stop.nodeid) && String(f[i].cityCode) === String(CFG.stop.cityCode)) keep = true;
  }
  if (!keep) saveAlert({ stop: null }, { favStops: out });
  else if (acctOn) cloudWrite({ favStops: out });
}

function errText(e) {
  var c = (e && e.code) || "";
  var map = {
    "auth/invalid-credential": "이메일 또는 비밀번호가 맞지 않습니다.",
    "auth/wrong-password": "이메일 또는 비밀번호가 맞지 않습니다.",
    "auth/user-not-found": "가입되지 않은 이메일입니다. '가입'을 눌러 주세요.",
    "auth/email-already-in-use": "이미 가입된 이메일입니다. '로그인'을 눌러 주세요.",
    "auth/weak-password": "비밀번호는 6자 이상이어야 합니다.",
    "auth/invalid-email": "이메일 형식이 맞지 않습니다.",
    "auth/network-request-failed": "인터넷 연결을 확인해 주세요.",
    "auth/operation-not-allowed": "Firebase 콘솔에서 이메일/비밀번호 로그인을 켜야 합니다.",
    "permission-denied": "권한이 없습니다. (Firestore 규칙 배포가 필요할 수 있습니다)",
    "failed-precondition": "Firestore 데이터베이스를 먼저 만들어야 합니다."
  };
  return map[c] || c || (e && e.message) || "오류가 발생했습니다.";
}

function cloudWrite(p) {
  if (!db || !fbUser) return;
  var d = {}, k;
  for (k in p) if (p.hasOwnProperty(k)) d[k] = p[k];
  d.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
  db.collection("accounts").doc(fbUser.uid).set(d, { mergeFields: Object.keys(d) }).then(function () { setMsg(""); }, function (e) { setMsg(errText(e), true); });
}

function saveAlert(p, extra) {
  var k;
  for (k in p) if (p.hasOwnProperty(k)) CFG[k] = p[k];
  if (!acctOn) {
    var keys = { on: "busAlertOn", buses: "busAlertBuses", min: "busAlertMin", vib: "busAlertVib", rep: "busAlertRep", gap: "busAlertGap", hear: "busAlertHear", stop: "busAlertStop", bset: "busAlertBset", sched: "busAlertSched" };
    for (k in p) if (p.hasOwnProperty(k) && keys[k]) lsSet(keys[k], p[k]);
  } else {
    if (extra) { var m = {}; for (k in p) if (p.hasOwnProperty(k)) m[k] = p[k]; for (k in extra) if (extra.hasOwnProperty(k)) m[k] = extra[k]; cloudWrite(m); }
    else cloudWrite(p);
    lsSet("acctCfg", CFG);
  }
  lastSig = sig();
  renderAll();
  syncNative();
}

function applyRemote(d) {
  CFG = { on: !!d.on, buses: d.buses || "", min: clampMin(d.min), hear: d.hear !== false, vib: d.vib !== false,
    rep: Number(d.rep) || 1, gap: Number(d.gap) || 60, stop: d.stop || null, bset: (d.bset && typeof d.bset === "object") ? d.bset : {}, sched: (d.sched instanceof Array) ? d.sched : [] };
  lsSet("acctCfg", CFG);
  if (d.scale) setScale(d.scale);
  if (toArr(d.favStops).length || (d.favStops && d.favStops.length === 0)) lsSet("busFavs", d.favStops);
  renderAll();
  var s = sig();
  if (s === lastSig) return;
  lastSig = s;

/* ---------- 안드로이드 앱: 백그라운드 음성 안내 서비스 ---------- */
function busCfgOf(no) {
  var e = (CFG.bset || {})[norm(no)];
  function cl(v, a, b, d) { v = Number(v) || d; return Math.min(b, Math.max(a, v)); }
  if (e) return { min: clampMin(e.m), voice: e.v !== false, vib: e.z !== false, rep: cl(e.r, 1, 20, 1), gap: cl(e.g, 10, 600, 60) };

}
function watchList() {

    var stop = CFG.stop || current;

      else AndroidBridge.startWatch(String(stop.cityCode), String(stop.nodeid), String(stop.nodenm), buses, Number(CFG.min));
    } else AndroidBridge.stopWatch();
  } catch (e) {}
}

/* ---------- 도착정보 ---------- */
function showStop(stop) {

  dirFor(String(stop.cityCode), String(stop.nodeid), function (t) { if (current === stop) $("stopDir").textContent = t ? "→ " + t : ""; });
  $("arr").innerHTML = '<div class="sub">불러오는 중…</div>';
  $("upd").textContent = "";

      clearInterval(timer);

// 같은 자리의 다른 시·군 정류장(이름 같고 약 100m 이내)을 한 번 찾아 두고, 도착정보를 합쳐서 보여 줌

/* ---------- 안내받을 버스 고르기 ---------- */
var routeCache = {};
function fetchRoutes(stop) {

  routeCache[k] = "loading";
  call("stopDirs", { cityCode: stop.cityCode, nodeid: stop.nodeid }, function (err0, items0) {
   if (!err0) return fetchRoutes.done(k, null, items0);
   call("stopRoutes", { cityCode: stop.cityCode, nodeid: stop.nodeid }, function (err, items) { fetchRoutes.done(k, err, items); });
  });
}
fetchRoutes.done = function (k, err, items) {
  {
    if (err) routeCache[k] = "error:" + err.message;
    else {
      var seen = {}, list = [], i, no;
      for (i = 0; i < items.length; i++) { no = String(items[i].routeno); if (!seen[no]) { seen[no] = 1; list.push({ no: no, dir: dirParts(items[i].dests || [], items[i].nexts) }); } }
      list.sort(function (a, b) { return (parseInt(a.no, 10) || 1e9) - (parseInt(b.no, 10) || 1e9) || (a.no < b.no ? -1 : 1); });
      routeCache[k] = list;

    renderBusChips();
    if (typeof renderScChips === "function") renderScChips();
  }
};
function selBuses() {

  var k = stopKey(stop), r = routeCache[k];

  var sel = selBuses(), selN = sel.map(norm), list = (r instanceof Array) ? r.slice() : [], i, j, has, html;
  for (i = 0; i < sel.length; i++) { has = false; for (j = 0; j < list.length; j++) if (norm(list[j].no) === norm(sel[i])) has = true; if (!has) list.push({ no: sel[i] }); }

    var favOut = favs().map(stopOut);

    if (has) { add.updatedAt = firebase.firestore.FieldValue.serverTimestamp(); return ref.set(add, { merge: true }); }
  }).then(function () {
    unsub = ref.onSnapshot(function (s) { if (s.exists) applyRemote(s.data()); }, function (e) { setMsg("설정을 불러올 수 없습니다. " + errText(e), true); });

function onAuth(user) {

  if (fbUser) {
    if (!acctOn) { acctOn = true; lsSet("acctOn", true); }
    lsSet("acctEmail", fbUser.email || "");
    startAcct(fbUser);
  } else if (acctOn) {
    if (unsub) { unsub(); unsub = null; }
    acctOn = false; lsSet("acctOn", false);
    CFG = localCfg();
    syncNative();
  }
  renderAll();
}

  try {
    firebase.initializeApp({ apiKey: "AIzaSyC8UZsQaZVtml-K3J8WyDuL4mjgnYAsQTo", authDomain: "bustime-c4cfd.firebaseapp.com", projectId: "bustime-c4cfd", appId: "1:179320810477:web:ad4b1241a9ab2a1ec055e4" });
    auth = firebase.auth();
    db = firebase.firestore();
    try { db.settings({ experimentalForceLongPolling: true, merge: true }); } catch (e) {}
    auth.onAuthStateChanged(onAuth);
  } catch (e) { setMsg("로그인 기능을 시작하지 못했습니다: " + (e.message || e), true); }

/* ---------- 예약 안내 ---------- */
var DAYN = ["", "월", "화", "수", "목", "금", "토", "일"];
var sc = null;
function schedList() { return (CFG.sched instanceof Array) ? CFG.sched : []; }
function pad2(n) { n = String(n); return n.length < 2 ? "0" + n : n; }
function dayText(d) {
  var x = d.slice().sort(function (a, b) { return a - b; }), j = x.join(), i, t = [];
  if (j === "1,2,3,4,5") return "평일";
  if (j === "6,7") return "주말";
  if (j === "1,2,3,4,5,6,7") return "매일";
  for (i = 0; i < x.length; i++) t.push(DAYN[x[i]]);
  return t.join("·");
}
function renderSched() {
  var l = schedList(), i, s, h = "", ex = true;
  for (i = 0; i < l.length; i++) {
    s = l[i];
    h += '<div class="fav"><div><b>' + dayText(s.d) + " " + esc(s.a) + "~" + esc(s.b) + "</b><br><span class=\"sub\">" + esc(s.stop && s.stop.nodenm) + " · " + esc(s.buses) + " · " + s.m + "분 전" + (s.v ? " 🔊" : "") + (s.z ? " 📳" : "") + (s.r > 1 ? " · " + s.r + "번 반복" : "") + "</span></div>" +
      '<div><button data-scon="' + i + '"' + (s.on ? "" : ' class="g"') + ">" + (s.on ? "켜짐" : "꺼짐") + '</button><button class="g" data-scedit="' + i + '">수정</button></div></div>';
  }
  $("schedList").innerHTML = h || '<div class="sub">예약이 없습니다.</div>';
  $("schedAdd").hidden = l.length >= 10;
  try { ex = !(NATIVE && typeof AndroidBridge.exactOk === "function") || AndroidBridge.exactOk(); } catch (e) {}
  $("exactBox").hidden = ex;
}
function scPaint() {
  var h = "", n;
  for (n = 1; n <= 7; n++) h += '<button data-scday="' + n + '"' + (sc.days[n] ? "" : ' class="g"') + ">" + DAYN[n] + "</button>";
  $("scDays").innerHTML = h;
  $("scVoice").innerHTML = sc.voice ? "🔊 음성: 켜짐" : "🔊 음성: 꺼짐";
  $("scVoice").className = sc.voice ? "" : "g";
  $("scVib").innerHTML = sc.vib ? "📳 진동: 켜짐" : "📳 진동: 꺼짐";
  $("scVib").className = sc.vib ? "" : "g";
  $("scBuses").value = sc.buses.join(", ");
}
function scStopObj() {
  var v = $("scStop").value, f = favs(), i;
  for (i = 0; i < f.length; i++) if (stopKey(f[i]) === v) return stopOut(f[i]);
  return null;
}
function renderScChips() {
  var box = $("scChips");
  if (!sc || $("scModal").hidden) return;
  var stop = scStopObj();
  if (!stop) { box.innerHTML = '<div class="sub">먼저 정류장을 고르세요.</div>'; return; }
  var k = stopKey(stop), r = routeCache[k];
  if (r === undefined) { fetchRoutes(stop); box.innerHTML = '<div class="sub">버스 목록을 불러오는 중…</div>'; return; }
  var selN = sc.buses.map(norm), list = (r instanceof Array) ? r.slice() : [], i, j, has, h = "";
  for (i = 0; i < sc.buses.length; i++) { has = false; for (j = 0; j < list.length; j++) if (norm(list[j].no) === norm(sc.buses[i])) has = true; if (!has) list.push({ no: sc.buses[i] }); }
  for (i = 0; i < list.length; i++) h += '<button' + (selN.indexOf(norm(list[i].no)) >= 0 ? ' class="on"' : "") + ' data-scbus="' + esc(list[i].no).replace(/"/g, "&quot;") + '">' + esc(list[i].no) + (list[i].dir ? "<br><small>→ " + esc(list[i].dir) + "</small>" : "") + "</button>";
  if (r === "loading") h += '<div class="sub">버스 목록을 불러오는 중…</div>';
  else if (typeof r === "string") h += '<div class="sub err">버스 목록을 가져오지 못했습니다. 아래에 직접 입력하세요.</div>';
  box.innerHTML = h;
}
function openSched(i) {
  var old = i != null ? schedList()[i] : null, n, hs = [], ms = [0, 10, 20, 30, 40, 50], mins = [], f = favs(), h;
  for (n = 0; n < 24; n++) hs.push(n);
  for (n = 5; n <= 20; n++) mins.push(n);
  fillSel("scFH", hs, function (v) { return pad2(v) + "시"; }); fillSel("scTH", hs, function (v) { return pad2(v) + "시"; });
  fillSel("scFM", ms, function (v) { return pad2(v) + "분"; }); fillSel("scTM", ms, function (v) { return pad2(v) + "분"; });
  fillSel("scMin", mins, function (v) { return v + "분 전"; });
  fillSel("scRep", [1, 2, 3, 5, 10], function (v) { return v === 1 ? "한 번만" : v + "번 반복"; });
  fillSel("scGap", [30, 60, 120], function (v) { return v === 30 ? "30초마다" : (v / 60) + "분마다"; });
  h = '<option value="">' + (f.length ? "(고르세요)" : "(즐겨찾기가 없습니다)") + "</option>";
  for (n = 0; n < f.length; n++) h += '<option value="' + esc(stopKey(f[n])) + '">' + esc(f[n].nodenm) + " (" + esc(f[n].cityName) + ")</option>";
  $("scStop").innerHTML = h;
  if (old) {
    var days = {}, k, a = old.a.split(":"), b = old.b.split(":");
    for (k = 0; k < old.d.length; k++) days[old.d[k]] = true;
    sc = { id: old.id, idx: i, on: old.on !== false, days: days, voice: old.v !== false, vib: old.z !== false, buses: String(old.buses || "").split(",").map(function (x) { return x.replace(/^\s+|\s+$/g, ""); }).filter(function (x) { return x; }) };
    $("scFH").value = String(Number(a[0])); $("scFM").value = String(Number(a[1])); $("scTH").value = String(Number(b[0])); $("scTM").value = String(Number(b[1]));
    $("scMin").value = String(clampMin(old.m)); $("scRep").value = String(inList(old.r, [1, 2, 3, 5, 10]) ? old.r : 1); $("scGap").value = String(inList(old.g, [30, 60, 120]) ? old.g : 60);
    $("scStop").value = old.stop ? stopKey(old.stop) : "";
    $("scTitle").innerHTML = "⏰ 예약 수정";
  } else {
    sc = { id: "s" + new Date().getTime().toString(36), idx: null, on: true, days: { 1: true, 2: true, 3: true, 4: true, 5: true }, voice: true, vib: true, buses: [] };
    $("scFH").value = "7"; $("scFM").value = "0"; $("scTH").value = "9"; $("scTM").value = "0";
    $("scMin").value = String(clampMin(CFG.min)); $("scRep").value = "1"; $("scGap").value = "60";
    $("scStop").value = CFG.stop ? stopKey(CFG.stop) : "";
    $("scTitle").innerHTML = "⏰ 예약 추가";
  }
  $("scErr").innerHTML = "";
  $("scDel").hidden = !old;
  scPaint();
  $("scModal").hidden = false;
  renderScChips();
}
function saveSched() {
  var a = pad2($("scFH").value) + ":" + pad2($("scFM").value), b = pad2($("scTH").value) + ":" + pad2($("scTM").value);
  var stop = scStopObj(), days = [], n, err = "";
  for (n = 1; n <= 7; n++) if (sc.days[n]) days.push(n);
  if (!days.length) err = "요일을 하나 이상 고르세요.";
  else if (a >= b) err = "끝나는 시각이 시작보다 늦어야 합니다.";
  else if (!stop) err = "안내받을 정류장을 고르세요.";
  else if (!sc.buses.length) err = "안내받을 버스를 하나 이상 고르세요.";
  else if (!sc.voice && !sc.vib) err = "음성이나 진동 중 하나는 켜 주세요.";
  if (err) { $("scErr").innerHTML = err; return; }
  var item = { id: sc.id, on: sc.on, d: days, a: a, b: b, stop: stop, buses: sc.buses.join(", "), m: Number($("scMin").value), v: sc.voice, z: sc.vib, r: Number($("scRep").value), g: Number($("scGap").value) };
  var l = schedList().slice();
  if (sc.idx != null) l[sc.idx] = item; else l.push(item);
  $("scModal").hidden = true; sc = null;
  saveAlert({ sched: l });
}

/* ---------- 이벤트 ---------- */
document.addEventListener("click", function (e) {
  var b = e.target;
  while (b && b.tagName !== "BUTTON") b = b.parentNode;
  if (!b || b === document) return;
  var v;
  if ((v = b.getAttribute("data-scon")) != null) { var l1 = schedList().slice(), it = {}, kk; for (kk in l1[v]) if (l1[v].hasOwnProperty(kk)) it[kk] = l1[v][kk]; it.on = !it.on; l1[v] = it; saveAlert({ sched: l1 }); return; }
  if ((v = b.getAttribute("data-scedit")) != null) { openSched(Number(v)); return; }
  if ((v = b.getAttribute("data-scday")) != null && sc) { sc.days[v] = !sc.days[v]; scPaint(); return; }
  if ((v = b.getAttribute("data-scpre")) != null && sc) { sc.days = v === "wk" ? { 1: true, 2: true, 3: true, 4: true, 5: true } : v === "we" ? { 6: true, 7: true } : { 1: true, 2: true, 3: true, 4: true, 5: true, 6: true, 7: true }; scPaint(); return; }
  if ((v = b.getAttribute("data-scbus")) != null && sc) {
    var ii, idx = -1;
    for (ii = 0; ii < sc.buses.length; ii++) if (norm(sc.buses[ii]) === norm(v)) idx = ii;
    if (idx >= 0) sc.buses.splice(idx, 1); else sc.buses.push(v);
    scPaint(); renderScChips(); return;
  }
  var al = b.getAttribute("data-alarm");
  if (al != null) {
    openAlarmModal(al);
    return;
  }
  var bs = b.getAttribute("data-bus");
  if (bs != null) toggleBus(bs);
  var fsz = b.getAttribute("data-scale"), fv = b.getAttribute("data-fav"), pk = b.getAttribute("data-pick");
  if (fsz) { setScale(fsz); if (acctOn) cloudWrite({ scale: Number(fsz) }); }
  if (fv != null) { showStop(favs()[fv]); }
  if (pk != null) {
    var x = searchStops.list[pk], f = favs(), i, has = false;
    for (i = 0; i < f.length; i++) if (stopKey(f[i]) === stopKey(x)) has = true;
    if (!has) { f.push(x); saveFavs(f); }
    saveAlert({ stop: x });
    showStop(x);
    $("found").innerHTML = ""; $("q").value = "";
    setMsg("'" + x.nodenm + "'을(를) 안내 정류장으로 정했습니다.");
  }
});
