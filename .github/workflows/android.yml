name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish APK to Releases (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk bustime.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest bustime.apk \
            --target "${{ github.sha }}" \
            --title "버스 와유~~ APK (최신)" \
            --notes "최신 빌드입니다. 아래 Assets의 bustime.apk를 눌러 받은 뒤 설치하세요. (안드로이드 5.0 이상, 출처를 알 수 없는 앱 설치 허용 필요, 기존 앱 위에 덮어 설치하면 설정이 유지됩니다)"

      - uses: actions/upload-artifact@v4
        with:
          name: bustime-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
